name: 'Hasura migrate'
description: 'Migrates a Hasura database'
inputs:
  endpoint:
    description: 'Endpoint of the Hasura instance'
    required: true
  database-name:
    description: 'Name of the database to migrate'
    required: true
  admin-secret:
    description: 'Admin secret of the Hasura instance'
    required: true
  cli-version:
    description: 'Hasura CLI version'
    required: false
    default: 'v2.1.1'
  working-directory:
    description: 'Working directory where hasura config is located'
    required: false
    default: '.'
runs:
  using: composite 
  steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
      with:
        node-version: 16
    - name: 'Install hasura-cli'
      shell: bash
      run: npm i -g hasura-cli@${{ inputs.cli-version }}
    - name: 'Apply hasura migrations and metadata'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        hasura migrate apply --endpoint ${{ inputs.endpoint }} --admin-secret ${{ inputs.admin-secret }} --log-level DEBUG --skip-update-check --database-name ${{ inputs.database-name }}
        # Without --disallow-inconsistent-metadata, apply exits 0 and drops every inconsistent
        # table, relationship and function from the API. CLIs older than about v2.15 lack the flag.
        if hasura metadata apply --help 2>&1 | grep -q -- '--disallow-inconsistent-metadata'; then
          hasura metadata apply --endpoint ${{ inputs.endpoint }} --admin-secret ${{ inputs.admin-secret }} --log-level DEBUG --skip-update-check --disallow-inconsistent-metadata
        else
          hasura metadata apply --endpoint ${{ inputs.endpoint }} --admin-secret ${{ inputs.admin-secret }} --log-level DEBUG --skip-update-check
        fi
        # Exits 1 if the server's metadata is inconsistent, so older CLIs still fail the job.
        # Apply already rebuilds the schema cache, so no separate reload is needed.
        hasura metadata inconsistency status --endpoint ${{ inputs.endpoint }} --admin-secret ${{ inputs.admin-secret }} --skip-update-check
